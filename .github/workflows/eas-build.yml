name: EAS Build from GitHub

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - ios
          - all
      profile:
        description: 'EAS build profile (defined in eas.json)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
          - development
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'

jobs:
  test_and_build:
    name: Test & Trigger EAS Build
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install dependencies
        run: npm ci || npm install

      - name: 4. Type check with TypeScript
        run: npx tsc --noEmit

      - name: 5. Run automated test suite
        run: npm test

      - name: 6. Install EAS CLI
        run: npm install -g eas-cli

      - name: 7. Execute EAS Build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PLATFORM: ${{ github.event.inputs.platform || 'android' }}
          PROFILE: ${{ github.event.inputs.profile || 'preview' }}
        run: |
          eas build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive
